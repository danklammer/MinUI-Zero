# ALSA-direct: "default" goes straight to the codec. This file OVERWRITES the donor's, which routed
# default to the pipewire plugin. That was the whole no-audio bug on the allowlist image
# (2026-08-27): the harvest carried the donor's asound.conf verbatim, every open of "default" tried
# to load libasound_module_pcm_pipewire.so, which we rightly do not ship, and SDL disabled audio.
# The routing switches were fine; nothing could reach them. The old denylist build has always
# overwritten this same file for this same reason.
pcm.!default {
    type plug
    slave.pcm "hw:0,0"
}
ctl.!default {
    type hw
    card 0
}
