# LOCK the pixel format. minarch only accepts RGB565 — RETRO_ENVIRONMENT_SET_PIXEL_FORMAT returns
# false for anything else (minarch.c: "565 is only supported format"). supafaust exposes
# rgb565|xrgb8888|0rgb1555, and with no cfg here the option was REACHABLE from the in-game Options
# menu on this platform: picking xrgb8888 gives a SNES that fails to load or renders as garbage,
# with nothing on screen to explain why. The Brick locks it; this pak had no cfg at all, and SUPA is
# the SNES folder every user gets in the base romset.
#
# rgb565 is already supafaust's default, so this changes nothing about how the core runs — it just
# takes away a menu entry that can only do harm.
-supafaust_pixel_format = rgb565

# Thread affinity: the Brick's masks are correct HERE TOO. This pak previously carried the MMP's
# rationale verbatim — "This device has two Cortex-A7s, so 0xc names CPUs that do not exist" — which
# is simply wrong for the H700: it is a QUAD-core Cortex-A53 (4 CPUs verified on-device 2026-08-10).
# The copied comment cost this platform the emu/ppu split the Brick gets. 0x3 = CPUs 0-1 (emu),
# 0xc = CPUs 2-3 (ppu). Caught by tools/check-parity.sh once h700 was added to it.
-supafaust_thread_affinity_emu = 0x3
-supafaust_thread_affinity_ppu = 0xc
