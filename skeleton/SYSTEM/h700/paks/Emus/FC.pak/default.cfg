# NES is 256x240. On this 640x480 panel the default "Aspect" scaling stretches that by 2.5x
# HORIZONTALLY (and 2.0x vertically), and a fractional nearest-neighbour scale duplicates some
# source columns and not others. Which columns get doubled shifts as the picture scrolls, so a
# scrolling background shimmers — reported as "jittery" in Contra. Native picks the largest INTEGER
# scale that fits (2x here = 512x480 with small side bars), so every source pixel is the same size.
# GB and GBC already do this on this platform. Not needed on the Brick: 256 -> 1024 is exactly 4x.
minarch_screen_scaling = Native

fceumm_sndquality = Low
fceumm_sndvolume = 10
-fceumm_aspect = 8:7 PAR
-fceumm_turbo_enable = Player 1
-fceumm_show_adv_system_options = disabled
-fceumm_show_adv_sound_options = disabled

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind A Button = A
bind B Button = B
bind A Turbo = NONE:X
bind B Turbo = NONE:Y
bind Change Disk = NONE:L1
bind Insert Disk = NONE:R1
bind Insert Coin = NONE:R2
