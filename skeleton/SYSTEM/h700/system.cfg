# h700 frontend defaults. A leading "-" LOCKS the option: minarch sets the value and hides the
# entry from the in-game Options > Frontend menu.
#
# Why several are locked here: this platform presents through the Allwinner DE layer, and the
# matching PLAT_ hooks are still stubs (platform.c). Leaving those entries visible offered choices
# that silently did nothing, which is what the Options menu looked wrong for (Dan 2026-08-11).
# Every lock below is a no-op hook, not a preference. Unlock each one as its hook lands, and see
# tools/plat-surface-allowlist.txt, which tracks the same gaps from the PLAT side.

# Panel geometry: 640x480, so NES/GB at Aspect gives a 2.5x horizontal scale and scroll shimmer.
# Same reasoning as the MMP (identical panel), declared in tools/parity-allowlist.txt.
minarch_screen_scaling = Native

# PLAT_setSharpness is a stub here: one scaler family, nothing reads the value.
-minarch_screen_sharpness = Crisp

# PLAT_setEffect is a stub here: no scanline/DMG effects on the DE path yet.
-minarch_screen_effect = None

# Presentation is ALWAYS vsync-synchronous on this platform: PLAT_flip commits to the DE layer and
# disp_wait_latch blocks until that commit latches, so there is no tearing to prevent and no knob
# to turn. PLAT_setVsync is deliberately a no-op ("the synchronous pan is the vsync").
-minarch_prevent_tearing = Strict

# HUD implemented 2026-08-11 (platform.c dbg_compose): the strips are composited into the RGB565
# render surface before the flip, so the DE scaler stretches them to the panel for free.
minarch_debug_hud = Off

# The closed-loop governor owns the clock during gameplay (Gov_start), so a static speed choice
# would just fight it. MEASURED 2026-08-11: every system tested settles at the 480MHz floor.
-minarch_cpu_speed = Normal

# Frontend threading has never been qualified on this platform. Off until it has a receipt.
-minarch_threading = Off
