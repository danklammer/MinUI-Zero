-minarch_threading = Off

-pcsx_rearmed_display_internal_fps = disabled
-pcsx_rearmed_show_input_settings = disabled

pcsx_rearmed_dithering = enabled

# pcsx's async GPU thread is upstream default-ON for multicore, and on the Brick it was THE
# decisive regression (D48): the gpu_async scanout-sync handshake SERIALIZED the emu and GPU
# threads, leaving both half-idle at gen 41/60 while raw work was only 86% of ONE core.
# Disabling it is already the default on Brick and Smart Pro; the Miyoo port never got it.
#
# The argument is stronger here, not weaker: the Brick has 4x Cortex-A53, this device has 2x A7.
# Splitting emulation and GPU across two weak cores and then handshaking every frame is close to
# the worst case for this SoC.
#
# UNMEASURED ON THIS HARDWARE — carried over on mechanism, not on an MMP benchmark. Left UNLOCKED
# (no leading '-') so it can be toggled in-game to A/B it against the same scene. With only 100MB
# of RAM against a 128MB SD swapfile, swap pressure may well dominate and make this secondary.
pcsx_rearmed_gpu_thread_rendering = disabled

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind Circle = A
bind Cross = B
bind Triangle = X
bind Square = Y
bind L1 Button = L1
bind R1 Button = R1
bind L2 Button = L2
bind R2 Button = R2