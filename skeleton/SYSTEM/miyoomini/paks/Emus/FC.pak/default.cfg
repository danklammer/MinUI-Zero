# NES is 256x240. On this 640x480 panel the default "Aspect" scaling stretches that by 2.5x
# HORIZONTALLY (and 2.0x vertically), and a fractional nearest-neighbour scale duplicates some
# source columns and not others. Which columns get doubled shifts as the picture scrolls, so a
# scrolling background shimmers — reported as "jittery" in Contra.
#
# Native picks the largest INTEGER scale that fits (minarch.c: MIN(DEVICE_WIDTH/src_w,
# DEVICE_HEIGHT/src_h)) = 2x here, i.e. 512x480 with small side bars and every source pixel the
# same size. GB and GBC already do this on this platform for the same reason.
#
# This does NOT show on the Brick: there 256 -> 1024 is exactly 4x, so its default is already
# integer horizontally.
minarch_screen_scaling = Native
