-minarch_screen_sharpness = Crisp
# Strict, not Lenient. MEASURED 2026-07-31: this panel runs at 59.341Hz (5400 flips in 91s, counted
# from the platform's own flip counter under Strict, where the panner is the clock). Every core
# assumes ~60. Lenient resolves the surplus by COALESCING — silently dropping 1.4% of Contra's
# frames, ~0.86/sec, which reads as scroll judder. Strict makes the producer wait instead, so no
# frame is ever discarded. Strict alone throttles a 60fps core below its native rate and starves
# audio; MINARCH_PANEL_FPS (exported by MinUI.pak) corrects that. The two go together.
-minarch_prevent_tearing = Strict

-minarch_cpu_speed = Normal
-minarch_threading = Off
