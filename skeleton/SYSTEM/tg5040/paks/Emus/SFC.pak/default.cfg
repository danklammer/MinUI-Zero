# supafaust's tuned options, carried over with the core from SUPA.pak. rgb565 matches our render
# path, and the affinities pin the emu and PPU threads to separate core pairs (D-note: emu=0x3,
# ppu=0xc). Swapping the core without these keeps it running but untuned — which would quietly
# throw away the reason for swapping.
-supafaust_pixel_format = rgb565
-supafaust_thread_affinity_emu = 0x3
-supafaust_thread_affinity_ppu = 0xc

bind Up = UP
bind Down = DOWN
bind Left = LEFT
bind Right = RIGHT
bind Select = SELECT
bind Start = START
bind Y Button = Y
bind X Button = X
bind B Button = B
bind A Button = A
bind L Button = L1
bind R Button = R1